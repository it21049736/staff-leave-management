spring.application.name=staff-leave-management

# --- Database (MySQL) ---
# Update these three if your local MySQL credentials differ.
spring.datasource.url=jdbc:mysql://localhost:3306/staffleave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:staffleave_app}
spring.datasource.password=${DB_PASSWORD:staffleave_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JSON: camelCase Java <-> snake_case wire format (matches the React frontend) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- JWT ---
app.jwt.secret=${JWT_SECRET:staff-leave-dev-secret-key-change-me-in-production-32bytes}
app.jwt.access-ttl-minutes=60
app.jwt.refresh-ttl-days=7

server.port=8000
